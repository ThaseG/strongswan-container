# Container logging: charon logs to stdout (`docker logs`).
#
# flush_line is essential: without it stdout is block-buffered and the last
# few KB of log are lost whenever the container stops or is killed.
# Override by mounting a replacement over /etc/strongswan.d/charon-logging-container.conf.
charon {
    filelog {
        stdout {
            default = 1
            ike_name = yes
            flush_line = yes
        }
    }
}
